</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-dot"></span><span id="brand-name">代購登記所</span></a>
    <div class="spacer"></div>
    <a class="btn sm ghost" href="#/">首頁</a>
    <button class="btn menu-btn" data-action="menu" aria-label="選單">☰</button>
  </header>
  <div id="menu" class="menu-panel hidden" role="menu"></div>

  <main id="app" class="wrap"><p class="center muted">載入中…</p></main>

  <!-- 首頁插圖預留區：想放插圖時，把 <svg>…</svg> 貼在下面的 template 裡面 -->
  <template id="hero-art-template">
    <!-- 首頁插圖：提著購物袋的毛毛蟲。想換掉就把整段 <svg>…</svg> 換成別的 -->
    <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="提著購物袋的毛毛蟲">
      <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <!-- 天空 -->
        <rect x="0" y="0" width="320" height="180" fill="#E3F1F7" stroke="none"/>
        <!-- 雲 -->
        <path d="M38 60 Q36 44 50 44 Q56 32 70 38 Q84 34 86 48 Q98 50 94 60 Z" fill="#FFFCF6"/>
        <path d="M226 38 Q226 24 236 25 Q242 17 252 22 Q262 20 262 30 Q270 32 266 38 Z" fill="#FFFCF6"/>
        <!-- 星星、愛心 -->
        <path d="M294 62 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" fill="#F6D27A"/>
        <path d="M300 106 l2 -6 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 z" fill="#F6D27A"/>
        <path transform="translate(-42 8)" d="M160 46 C160 40 168 39 169 45 C170 39 178 40 178 46 C178 52 169 57 169 57 C169 57 160 52 160 46 Z" fill="#F2A497"/>
        <!-- 草地 -->
        <path d="M-4 150 Q80 140 160 148 Q240 156 324 146 L324 184 L-4 184 Z" fill="#B9DAA5"/>
        <path d="M26 162 q4 -8 8 0 M292 164 q4 -8 8 0 M140 168 q4 -8 8 0" fill="none"/>
    
        <!-- 毛毛蟲小腳 -->
        <path d="M40 146 v6 M68 146 v7 M98 146 v7 M128 146 v7 M158 146 v7" fill="none"/>
        <!-- 身體（尾巴→頭） -->
        <circle cx="42" cy="132" r="16" fill="#B9DAA5"/>
        <circle cx="70" cy="128" r="20" fill="#F6D27A"/>
        <circle cx="100" cy="126" r="21" fill="#B9DAA5"/>
        <circle cx="130" cy="126" r="21" fill="#F6D27A"/>
        <circle cx="160" cy="124" r="22" fill="#B9DAA5"/>
        <!-- 身上的小點點 -->
        <g stroke="none" fill="#FFFCF6" opacity=".8">
          <circle cx="64" cy="120" r="3"/><circle cx="94" cy="118" r="3"/><circle cx="124" cy="118" r="3"/><circle cx="154" cy="115" r="3"/>
        </g>
    
        <!-- 背上的小禮物 -->
        <rect x="88" y="88" width="26" height="20" rx="4" fill="#A8D3E6"/>
        <path d="M101 88 v20" fill="none" stroke="#F2A497" stroke-width="4"/>
        <rect x="88" y="88" width="26" height="20" rx="4" fill="none"/>
        <path d="M101 88 q-10 -10 -12 -2 q2 4 12 2 q10 -10 12 -2 q-2 4 -12 2" fill="#F2A497"/>
    
        <!-- 觸角 -->
        <path d="M196 74 Q190 58 182 52" fill="none"/>
        <path d="M216 74 Q224 58 234 54" fill="none"/>
        <circle cx="181" cy="50" r="5" fill="#F2A497"/>
        <circle cx="235" cy="52" r="5" fill="#F2A497"/>
        <!-- 頭 -->
        <circle cx="206" cy="102" r="30" fill="#F6D27A"/>
        <circle cx="196" cy="98" r="4" fill="#3E3A39" stroke="none"/>
        <circle cx="218" cy="98" r="4" fill="#3E3A39" stroke="none"/>
        <circle cx="197.5" cy="96.5" r="1.3" fill="#FFFCF6" stroke="none"/>
        <circle cx="219.5" cy="96.5" r="1.3" fill="#FFFCF6" stroke="none"/>
        <ellipse cx="187" cy="110" rx="6" ry="3.5" fill="#F2A497" stroke="none"/>
        <ellipse cx="227" cy="110" rx="6" ry="3.5" fill="#F2A497" stroke="none"/>
        <path d="M201 110 Q207 116 213 110" fill="none"/>
    
        <!-- 購物袋 -->
        <path d="M248 112 Q258 88 268 112" fill="none"/>
        <rect x="238" y="110" width="40" height="40" rx="7" fill="#F2A497"/>
        <path d="M258 122 l2.5 -6 l2.5 6 l6 2 l-6 2 l-2.5 6 l-2.5 -6 l-6 -2 z" fill="#F6D27A" stroke-width="2"/>
        <!-- 手 -->
        <path d="M228 116 Q244 104 256 96" fill="none"/>
        <circle cx="257" cy="96" r="5" fill="#F6D27A"/>
      </g>
    </svg>
  </template>

  <div id="layer"></div>

</html>
